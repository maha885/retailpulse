# dbt package dependencies. Run `dbt deps` (from inside the dbt/ folder) to
# install these into dbt_packages/ before `dbt run`/`dbt test`.
#
# dbt-expectations ports most of Great Expectations' test vocabulary (value
# ranges, set membership, row-count sanity checks, etc.) into dbt's own
# SQL-based test framework -- chosen over standalone Great Expectations here to
# avoid adding another heavy Python dependency tree (pandas/SQLAlchemy/etc.)
# into the Airflow container, which already had real version conflicts to work
# through earlier in this project.

packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
  - package: calogica/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
